[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secondbrain"
version = "2.0.0"
description = "Chat with your own documents — local-first RAG. Point it at a folder, ingest, ask."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saqib Mazhar" }]
dependencies = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
secondbrain = "secondbrain.cli:main"

[tool.setuptools.packages.find]
include = ["secondbrain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
